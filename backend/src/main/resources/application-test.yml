    access-secret: test-access-secret-must-be-at-least-32-chars
    refresh-secret: test-refresh-secret-must-be-at-least-32ch
  cookie:
    secure: false
  openai:
    api-key:
  replicate:
    api-token:
  aws:
    access-key:
    secret-key:
    bucket:
  razorpay:
    key-id:
    key-secret:
    webhook-secret:
  admin:
    email: admin@test.local
    password: TestAdmin!23456
    name: Test Admin
