spring:
  application:
    name: adgenius-ai
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_BYTES:10485760}
      max-request-size: ${MAX_UPLOAD_BYTES:10485760}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  name: ${APP_NAME:AdGenius AI}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  api-base-url: ${API_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:dev-only-access-secret-change-me-32chars}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-only-refresh-secret-change-me-32ch}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}
  cookie:
    secure: ${COOKIE_SECURE:false}
    domain: ${COOKIE_DOMAIN:}
    same-site: ${COOKIE_SAMESITE:Lax}
  admin:
    email: ${ADMIN_BOOTSTRAP_EMAIL:admin@adgenius.local}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:ChangeMeAdmin!234}
    name: ${ADMIN_BOOTSTRAP_NAME:AdGenius Admin}
  mail:
    from: ${MAIL_FROM:noreply@adgenius.local}
  openai:
    api-key: ${OPENAI_API_KEY:}
    image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
  replicate:
    api-token: ${REPLICATE_API_TOKEN:}
    video-model: ${REPLICATE_VIDEO_MODEL:stability-ai/stable-video-diffusion}
  aws:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:ap-south-1}
    bucket: ${AWS_S3_BUCKET:}
    endpoint: ${AWS_S3_ENDPOINT:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  credits:
    free-initial: ${FREE_PLAN_INITIAL_CREDITS:50}
    image-cost: ${IMAGE_GENERATION_CREDIT_COST:2}
    video-cost: ${VIDEO_GENERATION_CREDIT_COST:10}
    content-cost: ${CONTENT_GENERATION_CREDIT_COST:1}
  storage:
    local-dir: ${LOCAL_STORAGE_DIR:./data/media}
    max-upload-bytes: ${MAX_UPLOAD_BYTES:10485760}
  rate-limit:
    auth-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
